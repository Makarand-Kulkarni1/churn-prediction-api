$yaml = @'
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Run tests
        run: python -m pytest -q
'@
[System.IO.File]::WriteAllText("$PWD\.github\workflows\ci.yml", $yaml, (New-Object System.Text.UTF8Encoding $false))